name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      prs_created: ${{ steps.rp.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please owns the two package.json files and the manifest; the go
  # constant lives at the repository root, where its generic updater refuses
  # to reach ("illegal pathing characters"), and an on-push trigger on the
  # release branch never fires because release-please pushes that branch with
  # GITHUB_TOKEN, whose pushes start no workflows. So the sync runs here, in
  # the same run that just touched the branch: read the branch's manifest,
  # align the one constant, push the correction back. Refusals are loud, and
  # TestVersionMatchesReleaseManifest stays as the net - if this job is ever
  # skipped wrongly, the release pr's own ci goes red on that test instead of
  # main going red after the merge.
  sync-go-version:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-please--branches--main

      - name: align borgo.go with the branch manifest
        run: |
          want="$(node -p 'require("./.release-please-manifest.json")["packages/borgo"]')"
          if [ -z "$want" ] || [ "$want" = "undefined" ]; then
            echo "::error::no packages/borgo entry in the manifest"; exit 1
          fi
          sed -i "s/^const Version = \"[0-9][^\"]*\"/const Version = \"$want\"/" borgo.go
          if ! grep -q "^const Version = \"$want\"" borgo.go; then
            echo "::error::borgo.go does not carry const Version = \"$want\" after the edit"; exit 1
          fi
          if git diff --quiet -- borgo.go; then
            echo "borgo.go already at $want"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add borgo.go
          git commit -m "chore: borgo.Version = $want"
          git push origin HEAD:release-please--branches--main
