name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # only the bun-latest alarm below runs on this
    - cron: "23 5 * * 1"

concurrency:
  # the event is part of the group: a scheduled run sits on refs/heads/main too,
  # and cancel-in-progress would have it kill the push CI it is not replacing
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the version the lockfiles were produced with. --frozen-lockfile is
      # resolver-sensitive, so pinning nine manifests and floating the tool
      # that reads them pins nothing
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: install workspace
        run: bun install --frozen-lockfile

      - name: docs links resolve and snippets typecheck
        run: bun run check:docs

      - name: build go core
        run: |
          go build ./...
          go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v testdata || true)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: go tests
        run: go test -race ./...

      - name: build example go module
        working-directory: examples/tasks
        run: |
          go build ./...
          go vet ./...

      - name: generated api types are fresh
        working-directory: examples/tasks
        run: |
          go tool borgogen
          git diff --exit-code -- .borgo/api-types.d.ts api/borgo.gen.go

      # must precede every tsc step below. six of the files examples/tasks
      # names in its tsconfig are written here and are gitignored, so on a cold
      # runner they simply do not exist - and an include entry that matches
      # nothing is silent in tsc. scripts/typecheck.ts now fails loudly on
      # that, which is the guard; this ordering is what makes it pass.
      - name: build example app
        working-directory: examples/tasks
        run: bun run build

      - name: typecheck
        run: bun run typecheck

      - name: bench harness typechecks
        working-directory: bench
        run: |
          bun install --frozen-lockfile
          bun run typecheck

      - name: bun tests
        run: bun run test

      - name: typed request bodies reject a wrong body
        working-directory: examples/tasks
        run: |
          printf '%s\n' \
            'import type { ActionContext } from "borgo-framework";' \
            'export async function action({ api }: ActionContext) {' \
            '  await api("POST /api/tasks", { body: { titel: "typo" } });' \
            '  return {};' \
            '}' \
            'export default function Wrong() { return null; }' \
            > pages/__wrong-body.tsx
          if bunx tsc --noEmit; then echo "wrong body was accepted" && exit 1; fi
          rm pages/__wrong-body.tsx

      - name: typed ws events reject a wrong payload
        working-directory: examples/tasks
        run: |
          printf '%s\n' \
            'import { subscribe } from "borgo-framework";' \
            'export function wrong() {' \
            '  subscribe("live", (event, data) => {' \
            '    if (event === "task-created") data.toFixed(2);' \
            '  });' \
            '}' \
            'export default function Wrong() { return null; }' \
            > pages/__wrong-ws.tsx
          if bunx tsc --noEmit; then echo "wrong ws payload was accepted" && exit 1; fi
          rm pages/__wrong-ws.tsx

      - name: typed ws publish rejects a wrong payload
        working-directory: examples/tasks
        run: |
          printf '%s\n' \
            'import { subscribe } from "borgo-framework";' \
            'export function wrong() {' \
            '  const channel = subscribe("live", () => {});' \
            '  channel.publish("message", 42);' \
            '}' \
            'export default function Wrong() { return null; }' \
            > pages/__wrong-publish.tsx
          if bunx tsc --noEmit; then echo "wrong publish payload was accepted" && exit 1; fi
          rm pages/__wrong-publish.tsx

      - name: server-only code stays out of client assets
        working-directory: examples/tasks
        run: |
          grep -q "borgo-server-only-sentinel" pages/index.tsx
          ! grep -rq "borgo-server-only-sentinel" public/assets

      - name: smoke test example app
        working-directory: examples/tasks
        run: |
          bun run start &
          smoke=$!
          for i in $(seq 1 20); do curl -fs http://localhost:3000/ > /dev/null && break; sleep 1; done
          curl -fs http://localhost:3000/ | grep -q "<h1>Tasks</h1>"
          curl -fs -X POST http://localhost:3000/api/tasks -H "Content-Type: application/json" -d '{"title":"ci smoke"}' | grep -q "ci smoke"
          curl -fs http://localhost:3000/ | grep -q "ci smoke"
          curl -fs http://localhost:3000/tasks/1 | grep -q "ci smoke"
          kill "$smoke"

      - name: install playwright chromium
        run: npx playwright install --with-deps chromium

      - name: e2e tests
        run: npx playwright test

      - name: scaffold test
        run: |
          tmp="$(mktemp -d)"
          cd packages/borgo && bun pm pack --destination "$tmp" && cd "$tmp"
          bun "$GITHUB_WORKSPACE/packages/create-borgo/src/cli.ts" smoke-app
          cd smoke-app
          echo "replace github.com/LuigiDavideMicca/borgo => $GITHUB_WORKSPACE" >> go.mod
          tgz="$(ls ../borgo-*.tgz | head -1)"
          sed -i "s#\"borgo-framework\": \"[^\"]*\"#\"borgo-framework\": \"file:$tgz\"#" package.json
          bun install
          go mod tidy
          cp .borgo/api-types.d.ts "$tmp/shipped-api-types.d.ts"
          go tool borgogen
          diff "$tmp/shipped-api-types.d.ts" .borgo/api-types.d.ts
          bunx tsc --noEmit
          bun run build
          PORT=3100 API_PORT=3601 bun run start &
          for i in $(seq 1 20); do curl -fs http://localhost:3100/ > /dev/null && break; sleep 1; done
          curl -fs http://localhost:3100/ | grep -q "Get started by editing"
          curl -fs http://localhost:3100/hello/ci | grep -q "hello, ci"
          curl -fs http://localhost:3100/api/hello | grep -q "hello from go"

      # the other two templates get the same day-zero guarantees (fresh
      # borgogen output matches the shipped types, tsc clean, build passes)
      # without the serve round-trip that the default template already covers
      - name: scaffold test (minimal + full)
        run: |
          tmp="$(mktemp -d)"
          cd packages/borgo && bun pm pack --destination "$tmp" && cd "$tmp"
          tgz="$(ls borgo-*.tgz | head -1)"
          for t in minimal full; do
            cd "$tmp"
            bun "$GITHUB_WORKSPACE/packages/create-borgo/src/cli.ts" "smoke-$t" --template "$t"
            cd "smoke-$t"
            echo "replace github.com/LuigiDavideMicca/borgo => $GITHUB_WORKSPACE" >> go.mod
            sed -i "s#\"borgo-framework\": \"[^\"]*\"#\"borgo-framework\": \"file:../$tgz\"#" package.json
            bun install
            go mod tidy
            cp .borgo/api-types.d.ts "$tmp/shipped-$t.d.ts"
            go tool borgogen
            diff "$tmp/shipped-$t.d.ts" .borgo/api-types.d.ts
            bunx tsc --noEmit
            bun run build
          done

          # the tailwind-wired scaffold must also build day zero: utilities
          # compiled, template styles preserved
          cd "$tmp"
          bun "$GITHUB_WORKSPACE/packages/create-borgo/src/cli.ts" smoke-tw --template base --tailwind
          cd smoke-tw
          echo "replace github.com/LuigiDavideMicca/borgo => $GITHUB_WORKSPACE" >> go.mod
          sed -i "s#\"borgo-framework\": \"[^\"]*\"#\"borgo-framework\": \"file:../$tgz\"#" package.json
          bun install
          go mod tidy
          bunx tsc --noEmit
          bun run build
          # the stylesheet is emitted under a content-hashed name
          grep -q "tab-size" public/assets/style-*.css
          grep -q "hero" public/assets/style-*.css

  # early warning for the pin above: a bun that stops accepting our lockfiles,
  # or stops running our scripts, breaks here on a schedule of its own instead
  # of on somebody's unrelated pull request
  bun-latest:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun version under test
        run: bun --version

      - name: install workspace
        run: bun install --frozen-lockfile

      - name: install bench
        working-directory: bench
        run: bun install --frozen-lockfile

      - name: docs links resolve and snippets typecheck
        run: bun run check:docs

      - name: bun tests
        run: bun run test

  # borgo dev supervises the api on macOS too, and the watchdog's darwin branch
  # cannot be reached from the ubuntu job: /proc answers there, kern.proc.pid
  # only answers here. This is the only place the sysctl reading, the struct
  # offsets it hardcodes and the zombie cases actually run. A separate job, so
  # it runs beside the pipeline rather than in front of it, and scoped to the
  # go tests that need a darwin kernel - everything else already runs on ubuntu
  # and would only buy flakier runners.
  go-macos:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: build go core
        run: |
          go build ./...
          go vet ./...

      - name: watchdog tests
        run: go test -race -count=1 -run '^(TestProcess|TestWaitParentExit|TestKinfo|TestProcStat|TestHelper)' .

  # the deploy story must keep building; a separate job so the image build
  # runs in parallel with the test pipeline
  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: build example image
        run: docker build -f examples/tasks/Dockerfile -t borgo-tasks .
