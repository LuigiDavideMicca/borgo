# one container, one command: `docker compose up -d`.
# the Dockerfile already sets NODE_ENV and BUN_CONFIG_MAX_HTTP_REQUESTS, so
# what is left here is the port and whatever this app actually needs - which,
# for the minimal template, is nothing: one page, one go route, no sessions and
# no database. grow this file as the app grows, rather than shipping a volume
# for data that does not exist.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    restart: unless-stopped
# adding persistence later? mount a volume and point the app's own path at it:
#   environment:
#     DB_PATH: /data/app.db
#   volumes:
#     - data:/data
# mount AT /data: the Dockerfile creates /data owned by the image user, and
# a named volume takes the owner of the directory it lands on. The image also
# has /data/uploads, borgo.Uploads' usual home, so a volume of its own there
# works too - but a volume at any path the image does not have is created
# root-owned, and the app cannot write there
# volumes:
#   data:
#
# adding sessions later? borgo.SetSession needs SESSION_SECRET (32+ random
# bytes) or every session route answers 500 - see docs/auth-and-sessions.md.
