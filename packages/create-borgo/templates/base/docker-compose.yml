# one container, one command: `docker compose up -d`.
# the Dockerfile already sets NODE_ENV and BUN_CONFIG_MAX_HTTP_REQUESTS, so
# what is left here is the port and whatever this app actually needs. the base
# template needs nothing else: its pages, its go routes and its sse hub all
# keep their state in memory, with no database and no sessions. grow this file
# as the app grows, rather than shipping a volume for data that does not exist.
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
    restart: unless-stopped
# adding persistence later? mount a volume and point the app's own path at it:
#   environment:
#     DB_PATH: /data/app.db
#   volumes:
#     - data:/data
# volumes:
#   data:
#
# adding sessions later? borgo.SetSession needs SESSION_SECRET (32+ random
# bytes) or every session route answers 500 - see docs/auth-and-sessions.md.
